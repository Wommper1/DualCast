name: Bug report
description: Something did not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying DualCast. For security problems, do not use this form: see SECURITY.md for the private route.
  - type: input
    id: version
    attributes:
      label: DualCast version
      description: Right-click DualBluetooth.exe, Properties, Details.
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Bluetooth adapter and the two devices
      description: Brand and model if you know them.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: "The last lines of %LOCALAPPDATA%\\DualBluetooth\\logs\\dualcast.log. Read it first: error text can include device names."
      render: text
