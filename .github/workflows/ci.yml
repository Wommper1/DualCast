name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DualBluetooth.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build DualBluetooth.slnx --configuration Release --no-restore

      - name: Tests
        run: dotnet test tests/DualBluetooth.Tests/DualBluetooth.Tests.csproj --configuration Release --no-build

      - name: Known-vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list DualBluetooth.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'has the following vulnerable packages') { throw 'A vulnerable package was found.' }
